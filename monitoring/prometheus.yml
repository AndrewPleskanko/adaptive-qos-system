global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-service:8080', 'host.docker.internal:8080']

  - job_name: 'core-processor'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['core-processor:8081', 'host.docker.internal:8081']
